    prop: 'margem',
    colors: [[0,'#d32f2f'],[5,'#ff5722'],[10,'#ff9800'],[20,'#ffeb3b'],[35,'#66bb6a'],[50,'#2e7d32']],
    legend: 'Vermelho=fragil (<10pp), verde=seguro (>35pp)'
  },
  renda: {
    prop: 'renda',
    colors: [[400,'#4a0000'],[600,'#d32f2f'],[800,'#ff9800'],[1200,'#ffeb3b'],[1800,'#66bb6a'],[3000,'#1b5e20']],
    legend: 'Renda mediana: vermelho=baixa, verde=alta'
  },
  educacao: {
    prop: 'alfa',
    colors: [[65,'#4a0000'],[75,'#d32f2f'],[82,'#ff9800'],[88,'#ffeb3b'],[93,'#66bb6a'],[99,'#1b5e20']],
    legend: 'Alfabetizacao %: vermelho=baixa, verde=alta'
  },
  infra: {
    prop: 'urbana',
    colors: [[10,'#4a0000'],[30,'#d32f2f'],[50,'#ff9800'],[65,'#ffeb3b'],[80,'#66bb6a'],[100,'#1b5e20']],
    legend: 'Urbanizacao %: vermelho=rural, verde=urbano'
  },
  duracao: {
    prop: 'duracao',
    colors: [[520,'#1b5e20'],[540,'#66bb6a'],[555,'#ffeb3b'],[570,'#ff9800'],[585,'#d32f2f'],[620,'#4a0000']],
    legend: 'Duracao votacao (min): verde=rapido, vermelho=lento'
  },
  turnout: {
    prop: 'turnout',
    colors: [[70,'#4a0000'],[75,'#d32f2f'],[78,'#ff9800'],[80,'#ffeb3b'],[83,'#66bb6a'],[88,'#1b5e20']],
    legend: 'Turnout %: vermelho=baixo, verde=alto'
  }
};

map.on('load', () => {
  map.addSource('ce', { type: 'geojson', data: geojson });

  Object.entries(layerConfigs).forEach(([id, cfg]) => {
    const stops = cfg.colors;
    const colorExpr = ['interpolate', ['linear'], ['get', cfg.prop]];
    stops.forEach(([val, color]) => { colorExpr.push(val, color); });

    map.addLayer({
      id,
      type: 'circle',
      source: 'ce',
      layout: { visibility: id === 'margem' ? 'visible' : 'none' },
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['get', 'pop'],
          5000, 5, 30000, 8, 80000, 12, 200000, 16, 500000, 22, 2700000, 30
        ],
        'circle-color': colorExpr,
        'circle-opacity': 0.88,
        'circle-stroke-width': 1,
        'circle-stroke-color': '#555'
      }
    });
  });

  // Radio
  const allIds = Object.keys(layerConfigs);
  document.querySelectorAll('input[name="layer"]').forEach(r => {
    r.addEventListener('change', e => {
      allIds.forEach(id => map.setLayoutProperty(id, 'visibility', id === e.target.value ? 'visible' : 'none'));
      document.getElementById('legend').innerHTML = '<b>' + layerConfigs[e.target.value].legend + '</b>';
    });
  });
  document.getElementById('legend').innerHTML = '<b>' + layerConfigs.margem.legend + '</b>';

  // Popup
  const popup = new mapboxgl.Popup({ closeButton: true, maxWidth: '360px' });
  allIds.forEach(layerId => {
    map.on('click', layerId, e => {
      const p = e.features[0].properties;
      const alertClass = p.alerta === 'PERDENDO' ? 'alerta-perdendo' : (p.alerta === 'FRAGIL' ? 'alerta-fragil' : 'alerta-seguro');
      const delta = Number(p.delta).toFixed(1);
      popup.setLngLat(e.lngLat).setHTML(`
        <h4>${p.nome}/CE</h4>
        <table>
          <tr><td>Populacao</td><td>${Number(p.pop).toLocaleString('pt-BR')}</td></tr>
          <tr><td>Status</td><td class="${alertClass}">${p.alerta}</td></tr>
          <tr><td colspan="2" style="border-top:2px solid #ddd;padding-top:4px"><b>Presidente</b></td></tr>
          <tr><td>Lula 2022</td><td>${p.pct_lula}%</td></tr>
          <tr><td>Bolsonaro 2022</td><td>${p.pct_bolso}%</td></tr>
          <tr><td>Margem Lula 2022</td><td style="color:#d32f2f">+${p.margem}pp</td></tr>
          <tr><td>Margem Lula 2018</td><td>+${p.margem18}pp</td></tr>
          <tr><td>Variacao</td><td style="color:${delta>0?'#388e3c':'#d32f2f'}">${delta>0?'+':''}${delta}pp</td></tr>
          <tr><td colspan="2" style="border-top:2px solid #ddd;padding-top:4px"><b>Prefeito</b></td></tr>
          <tr><td>2024</td><td>${p.prefeito24} (${p.partido24})</td></tr>
          <tr><td>Partido 2020</td><td>${p.partido20}</td></tr>
          <tr><td colspan="2" style="border-top:2px solid #ddd;padding-top:4px"><b>IBGE / Operacional</b></td></tr>
          <tr><td>Renda mediana</td><td>R$${Number(p.renda).toLocaleString('pt-BR')}</td></tr>
          <tr><td>Alfabetizacao</td><td>${p.alfa}%</td></tr>
          <tr><td>Urbanizacao</td><td>${p.urbana}%</td></tr>
          <tr><td>Idade mediana</td><td>${p.idade}</td></tr>
          <tr><td>Turnout</td><td>${p.turnout}%</td></tr>
          <tr><td>Duracao votacao</td><td>${Math.round(p.duracao)} min</td></tr>
          <tr><td colspan="2" style="border-top:2px solid #ddd;padding-top:4px"><b>Scores consolidacao</b></td></tr>
          <tr><td>Renda</td><td>${p.sr}</td></tr>
          <tr><td>Educacao</td><td>${p.se}</td></tr>
          <tr><td>Infraestrutura</td><td>${p.si}</td></tr>
        </table>
      `).addTo(map);
    });
    map.on('mouseenter', layerId, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', layerId, () => map.getCanvas().style.cursor = '');
  });

  // Stats
  const frageis = geojson.features.filter(f => f.properties.alerta === 'FRAGIL').length;
  const perdendo = geojson.features.filter(f => f.properties.alerta === 'PERDENDO').length;
  document.getElementById('stats').innerHTML = `
    <b>Ceara — ${geojson.features.length} municipios</b><br>
    <span style="color:#388e3c">${geojson.features.length - frageis - perdendo} seguros</span><br>
    <span style="color:#ff9800">${frageis} frageis</span> (margem <10pp)<br>
    <span style="color:#d32f2f">${perdendo} perdendo</span> (caiu >5pp)
  `;
});
</script>
</body>
</html>
